name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic packages
        run: python tools/build.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate Magisk package
        run: python tools/validate.py dist/bypass-flag-secure-android-magisk-v0.1.0.zip

      - name: Validate KernelSU package
        run: python tools/validate.py dist/bypass-flag-secure-android-kernelsu-v0.1.0.zip

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bypass-flag-secure-android-v0.1.0
          path: |
            dist/*.zip
            dist/SHA256SUMS
